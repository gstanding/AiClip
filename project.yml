name: AiClip
options:
  bundleIdPrefix: com.aiclip
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: false

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"

targets:
  AiClip:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: AiClip
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aiclip.app
        INFOPLIST_FILE: AiClip/Info.plist
        CODE_SIGN_ENTITLEMENTS: AiClip/AiClip.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: false
        PRODUCT_NAME: AiClip
    dependencies:
      - target: AiClipWidgetExtension
    entitlements:
      path: AiClip/AiClip.entitlements

  AiClipWidgetExtension:
    type: app-extension
    supportedDestinations: [iOS, macOS]
    sources:
      - path: AiClipWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aiclip.app.widget
        INFOPLIST_FILE: AiClipWidget/Info.plist
        GENERATE_INFOPLIST_FILE: false
        PRODUCT_NAME: AiClipWidgetExtension
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"

  AiClipTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    sources:
      - path: AiClipTests
    dependencies:
      - target: AiClip
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true

  AiClipUITests:
    type: bundle.ui-testing
    supportedDestinations: [iOS, macOS]
    sources:
      - path: AiClipUITests
    dependencies:
      - target: AiClip
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
